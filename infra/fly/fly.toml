# Fly.io configuration for the ProofForge API and judge. Fly Machines are microVMs with
# their own Linux kernel, so Comparator's bubblewrap sandbox gets the user namespaces it needs.
# Deploy with infra/fly/deploy.sh, which builds from tracked files only.
app = "proofforge"
primary_region = "iad"

[env]
  PF_DATA = "/data"
  PF_MODE = "replay"
  PF_CLIENT_IP_HEADER = "fly-client-ip"
  PF_CONTAINER_SLOTS = "2"
  PF_DAILY_LIVE_USD = "30"
  PF_CORS = "https://proofforge-nu.vercel.app,http://localhost:3000"

[mounts]
  source = "pf_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "performance-4x"
  memory = "8gb"
