name = "proofforge"
defaultTargets = ["Payout", "Solution"]

# Protected spec and locked challenge (owner-reviewed; hashed in spec/requirements.yaml).
[[lean_lib]]
name = "Payout"
srcDir = "spec"
roots = ["Payout.Spec", "Payout.Lemmas", "Payout.Challenge"]

# Candidate solution: fills the `Payout.step` definition hole and proves every requirement.
[[lean_lib]]
name = "Solution"
srcDir = "candidate"

# Executable built from the accepted solution (wrapper is TESTED_ONLY).
[[lean_exe]]
name = "payout-sidecar"
srcDir = "app"
root = "Main"
