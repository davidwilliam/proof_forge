name = "proofforge"
defaultTargets = ["ClmmMath", "Solution"]

# Protected spec, protected lemmas and locked challenge.
[[lean_lib]]
name = "ClmmMath"
srcDir = "spec"
roots = ["ClmmMath.Spec", "ClmmMath.Lemmas", "ClmmMath.Challenge"]

# Candidate solution: fills the `ClmmMath.checkedShlw` definition hole and proves every requirement.
[[lean_lib]]
name = "Solution"
srcDir = "candidate"

# Executable built from the accepted solution (wrapper is TESTED_ONLY).
[[lean_exe]]
name = "clmm-sidecar"
srcDir = "app"
root = "Main"
