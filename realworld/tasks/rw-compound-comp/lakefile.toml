name = "proofforge"
defaultTargets = ["CompRewards", "Solution"]

# Protected spec, sanity theorems and locked challenge.
[[lean_lib]]
name = "CompRewards"
srcDir = "spec"
roots = ["CompRewards.Spec", "CompRewards.Sanity", "CompRewards.Challenge"]

# Candidate solution: fills the `CompRewards.comptroller` definition hole and proves every requirement.
[[lean_lib]]
name = "Solution"
srcDir = "candidate"

# Executable built from the candidate (wrapper is TESTED_ONLY).
[[lean_exe]]
name = "comp-sidecar"
srcDir = "app"
root = "Main"
