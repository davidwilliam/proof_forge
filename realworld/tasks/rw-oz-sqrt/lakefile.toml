name = "proofforge"
defaultTargets = ["OzSqrt", "Solution"]

# Protected spec, protected lemmas and locked challenge.
[[lean_lib]]
name = "OzSqrt"
srcDir = "spec"
roots = ["OzSqrt.Spec", "OzSqrt.Lemmas", "OzSqrt.Challenge"]

# Candidate solution: fills the `OzSqrt.sqrt` definition hole and proves every requirement.
[[lean_lib]]
name = "Solution"
srcDir = "candidate"

# Executable built from the candidate (wrapper is TESTED_ONLY).
[[lean_exe]]
name = "sqrt-sidecar"
srcDir = "app"
root = "Main"
