name = "proofforge"
defaultTargets = ["OrderRouter", "Solution"]

# Protected spec, helper lemmas and locked challenge.
[[lean_lib]]
name = "OrderRouter"
srcDir = "spec"
roots = ["OrderRouter.Spec", "OrderRouter.Lemmas", "OrderRouter.Challenge"]

# Candidate solution: fills the `OrderRouter.step` definition hole and proves every requirement.
[[lean_lib]]
name = "Solution"
srcDir = "candidate"

# Executable built from the candidate (wrapper is TESTED_ONLY).
[[lean_exe]]
name = "router-sidecar"
srcDir = "app"
root = "Main"
