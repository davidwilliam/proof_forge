name = "proofforge"
defaultTargets = ["ShareVault", "Solution"]

# Protected spec, sanity theorems and locked challenge.
[[lean_lib]]
name = "ShareVault"
srcDir = "spec"
roots = ["ShareVault.Spec", "ShareVault.Sanity", "ShareVault.Challenge"]

# Candidate solution: fills the `ShareVault.vault` definition hole and proves every requirement.
[[lean_lib]]
name = "Solution"
srcDir = "candidate"

# Executable built from the candidate (wrapper is TESTED_ONLY).
[[lean_exe]]
name = "vault-sidecar"
srcDir = "app"
root = "Main"
