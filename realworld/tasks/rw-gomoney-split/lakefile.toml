name = "proofforge"
defaultTargets = ["EqualSplit", "Solution"]

# Protected spec and locked challenge.
[[lean_lib]]
name = "EqualSplit"
srcDir = "spec"
roots = ["EqualSplit.Spec", "EqualSplit.Challenge"]

# Candidate solution: fills the `EqualSplit.split` definition hole and proves every requirement.
[[lean_lib]]
name = "Solution"
srcDir = "candidate"

# Executable built from the accepted solution (wrapper is TESTED_ONLY).
[[lean_exe]]
name = "split-sidecar"
srcDir = "app"
root = "Main"
