[package]
name = "pf_cetus"
edition = "legacy"

# Adapter package for eval/realworld_cetus.py. Its sources are assembled at run time:
# sources/integer_mate/*.move from CetusProtocol/integer-mate at the pinned commit,
# sources/cetus/{clmm_math,tick_math}.move from CetusProtocol/cetus-clmm-interface at its
# pinned commit, all copied unmodified, plus the generated test module sources/cases.move.
# Only this manifest is ours: it names the three module addresses so that both projects'
# modules build as one package.
[addresses]
pf_cetus = "0x0"
integer_mate = "0xa1"
cetusclmm = "0xa2"
