# Replays operation sequences on Hundred Finance's deployed hWBTC market (Optimism), forked at
# block 90761917, the last block before the attack. Run by eval/vault.py, which copies this
# directory into its cache, installs forge-std at a pinned commit and sets PF_IO.
[profile.default]
src = "test"
test = "test"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "./io" }]
