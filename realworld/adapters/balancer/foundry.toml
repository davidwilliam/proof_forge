# Runs swap batches through Balancer V2's deployed Vault and the osETH/WETH Composable Stable
# Pool on Ethereum, forked just before the November 2025 attack transaction. Run by
# eval/realworld_balancer.py, which copies this directory into its cache, installs forge-std at
# a pinned commit and sets PF_ETH_RPC.
[profile.default]
src = "test"
test = "test"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "./io" }]
