[profile.default]
src = "src"
test = "test"
out = "out"
libs = []
solc_version = "0.5.16"
optimizer = true
optimizer_runs = 200
evm_version = "istanbul"
gas_limit = "18446744073709551615"
memory_limit = 4294967296
fs_permissions = [{ access = "read-write", path = "./io" }]
offline = false

[lint]
lint_on_build = false
