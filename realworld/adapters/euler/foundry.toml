[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
remappings = ["hardhat/=lib/hardhat/"]
solc_version = "0.8.10"
optimizer = true
optimizer_runs = 1000000
disable_code_size_limit = true
gas_limit = "18446744073709551615"
memory_limit = 4294967296
fs_permissions = [{ access = "read-write", path = "./io" }]
offline = false
