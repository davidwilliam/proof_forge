name = "proofforge"
defaultTargets = ["Grants", "Solution"]

# Protected spec and locked challenge.
[[lean_lib]]
name = "Grants"
srcDir = "spec"
roots = ["Grants.Spec", "Grants.Challenge"]

# Candidate solution: fills the `Grants.step` definition hole and proves every requirement.
[[lean_lib]]
name = "Solution"
srcDir = "candidate"

# Executable built from the accepted solution.
[[lean_exe]]
name = "grants-sidecar"
srcDir = "app"
root = "Main"
