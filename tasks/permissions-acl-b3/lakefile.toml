name = "proofforge"
defaultTargets = ["Acl", "Solution"]

# Protected spec and locked challenge.
[[lean_lib]]
name = "Acl"
srcDir = "spec"
roots = ["Acl.Spec", "Acl.Challenge"]

# Candidate solution: fills the `Acl.step` definition hole and proves every requirement.
[[lean_lib]]
name = "Solution"
srcDir = "candidate"

# Executable built from the accepted solution.
[[lean_exe]]
name = "acl-sidecar"
srcDir = "app"
root = "Main"
