name = "proofforge"
defaultTargets = ["Batch", "Solution"]

# Protected spec and locked challenge.
[[lean_lib]]
name = "Batch"
srcDir = "spec"
roots = ["Batch.Spec", "Batch.Lemmas", "Batch.Challenge"]

# Candidate solution: fills the `Batch.step` definition hole and proves every requirement.
[[lean_lib]]
name = "Solution"
srcDir = "candidate"

# Executable built from the candidate (wrapper is TESTED_ONLY).
[[lean_exe]]
name = "batch-sidecar"
srcDir = "app"
root = "Main"
