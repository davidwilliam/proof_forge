name = "proofforge"
defaultTargets = ["EntryLog", "Solution"]

# Protected spec and locked challenge.
[[lean_lib]]
name = "EntryLog"
srcDir = "spec"
roots = ["EntryLog.Spec", "EntryLog.Lemmas", "EntryLog.Challenge"]

# Candidate solution: fills the `EntryLog.step` definition hole and proves every requirement.
[[lean_lib]]
name = "Solution"
srcDir = "candidate"

# Executable built from the candidate (wrapper is TESTED_ONLY).
[[lean_exe]]
name = "log-sidecar"
srcDir = "app"
root = "Main"
