name = "proofforge"
defaultTargets = ["FixedWindow", "Solution"]

# Protected spec, helper lemmas and locked challenge (hashed in spec/locked.json).
[[lean_lib]]
name = "FixedWindow"
srcDir = "spec"
roots = ["FixedWindow.Spec", "FixedWindow.Lemmas", "FixedWindow.Challenge"]

# Candidate solution: fills the `FixedWindow.step` definition hole and proves every requirement.
[[lean_lib]]
name = "Solution"
srcDir = "candidate"

# Executable built from the candidate solution (wrapper is TESTED_ONLY).
[[lean_exe]]
name = "window-sidecar"
srcDir = "app"
root = "Main"
