name = "proofforge"
defaultTargets = ["Journal", "Solution"]

# Protected spec and locked challenge.
[[lean_lib]]
name = "Journal"
srcDir = "spec"
roots = ["Journal.Spec", "Journal.Lemmas", "Journal.Challenge"]

# Candidate solution: fills the `Journal.step` definition hole and proves every requirement.
[[lean_lib]]
name = "Solution"
srcDir = "candidate"

# Executable built from the candidate (wrapper is TESTED_ONLY).
[[lean_exe]]
name = "journal-sidecar"
srcDir = "app"
root = "Main"
