name = "proofforge"
defaultTargets = ["BoundedQueue", "Solution"]

# Protected spec and locked challenge.
[[lean_lib]]
name = "BoundedQueue"
srcDir = "spec"
roots = ["BoundedQueue.Spec", "BoundedQueue.Challenge"]

# Candidate solution: fills the `BoundedQueue.step` definition hole and proves every requirement.
[[lean_lib]]
name = "Solution"
srcDir = "candidate"

# Executable built from the candidate solution.
[[lean_exe]]
name = "queue-sidecar"
srcDir = "app"
root = "Main"
