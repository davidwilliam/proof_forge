name = "proofforge"
defaultTargets = ["Reversal", "Solution"]

# Protected spec and locked challenge.
[[lean_lib]]
name = "Reversal"
srcDir = "spec"
roots = ["Reversal.Spec", "Reversal.Lemmas", "Reversal.Challenge"]

# Candidate solution: fills the `Reversal.step` definition hole and proves every requirement.
[[lean_lib]]
name = "Solution"
srcDir = "candidate"

# Executable built from the candidate (wrapper is TESTED_ONLY).
[[lean_exe]]
name = "reversal-sidecar"
srcDir = "app"
root = "Main"
