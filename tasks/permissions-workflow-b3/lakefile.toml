name = "proofforge"
defaultTargets = ["Workflow", "Solution"]

# Protected spec and locked challenge.
[[lean_lib]]
name = "Workflow"
srcDir = "spec"
roots = ["Workflow.Spec", "Workflow.Challenge"]

# Candidate solution: fills the `Workflow.step` definition hole and proves every requirement.
[[lean_lib]]
name = "Solution"
srcDir = "candidate"

# Executable built from the accepted solution.
[[lean_exe]]
name = "workflow-sidecar"
srcDir = "app"
root = "Main"
