name = "proofforge"
defaultTargets = ["PrioQueue", "Solution"]

# Protected spec and locked challenge.
[[lean_lib]]
name = "PrioQueue"
srcDir = "spec"
roots = ["PrioQueue.Spec", "PrioQueue.Challenge"]

# Candidate solution: fills the `PrioQueue.step` definition hole and proves every requirement.
[[lean_lib]]
name = "Solution"
srcDir = "candidate"

# Executable built from the candidate solution.
[[lean_exe]]
name = "prio-sidecar"
srcDir = "app"
root = "Main"
