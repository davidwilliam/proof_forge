name: Task proposal
description: A new task, from a real incident or a component that moves money.
labels: [task-proposal]
body:
  - type: textarea
    id: component
    attributes:
      label: Component and source
      description: What the code does, where it is deployed or published, and the pinned commit or address.
    validations:
      required: true
  - type: textarea
    id: property
    attributes:
      label: Property
      description: What the code must guarantee, in one or two sentences, and how the vulnerable version breaks it.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sources
      description: Incident reports, audits or advisories, with links.
