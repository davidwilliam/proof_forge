name: Soundness report
description: A candidate or Passport that ProofForge accepts but should not. For a flaw that lets a wrong candidate pass, prefer a private report (Security tab, "Report a vulnerability").
labels: [soundness]
body:
  - type: input
    id: task
    attributes:
      label: Task id
      placeholder: rw-balancer-upscale
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: What is accepted, and why it should not be
      description: The requirement that does not hold, or the check that should have failed.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: The candidate file (or a link to it) and the exact `bin/proofforge check` or `verify` command with its output.
      render: shell
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse HEAD`.
