# Proof-carrying PR check for the payout component.
#
# pull_request_target runs this workflow and the harness from the base branch. The PR
# head is checked out only as data: its candidate files are judged against the base
# branch's locked spec, so a PR that edits the harness, the lock or the spec cannot
# change the verdict (the tree check reports protected-file edits). Candidate Lean code is
# built only inside the pinned image with no network, after the implementation scan.
name: proofforge
# Runs on every PR from the owner, members and collaborators, so a change that touches only
# protected files (spec, lock, harness) is judged as well and reported by the tree check. A PR
# from anyone else is judged only after a maintainer adds the `proofforge-check` label, so a
# stranger's PR does not build Lean code on the runner unreviewed.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: read
  pull-requests: write
jobs:
  check:
    if: >-
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) ||
      contains(github.event.pull_request.labels.*.name, 'proofforge-check')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the trusted base
        uses: actions/checkout@v4
        with:
          # Resolve the trusted target branch at job start. An existing PR's recorded
          # base SHA can predate fixes to the checker; record the resolved SHA below.
          ref: ${{ github.event.pull_request.base.ref }}
          path: trusted
      - name: Record the trusted checker revision
        run: git -C trusted rev-parse HEAD > trusted-base.txt
      - name: Check out the PR head as data
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - name: Build the pinned Lean image
        run: docker build -t proofforge-lean:4.35.0 -f trusted/infra/docker/Dockerfile.lean trusted/infra/docker
      - name: Allow Bubblewrap user namespaces on the Ubuntu runner
        # Ubuntu 24.04 requires an explicit userns allowance for sandbox builders.
        # Scope it to bwrap; retain Comparator's sandbox and the host-wide restriction.
        # https://discourse.ubuntu.com/t/ubuntu-24-04-lts-noble-numbat-release-notes/39890
        run: |
          sudo tee /etc/apparmor.d/proofforge-bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile proofforge-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/proofforge-bwrap
      - name: Judge the candidate
        id: judge
        run: |
          set +e
          python3 trusted/bin/proofforge check --task payout-flagship --candidate pr/formal \
            --out passport.json --comment comment.md
          verdict=$?
          echo "exit=$verdict" >> "$GITHUB_OUTPUT"
          if [ "$verdict" -ne 0 ]; then
            python3 trusted/harness/judge.py pr/formal --task payout-flagship --json judge.json || true
            python3 -c 'import json; d=json.load(open("judge.json")); print(json.dumps(d["checks"], indent=2))'
          fi
      - name: Reproduce the accepted Passport
        if: steps.judge.outputs.exit == '0'
        run: python3 trusted/bin/proofforge verify passport.json --candidate pr/formal
      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file comment.md
      - name: Upload the Passport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passport
          path: |
            passport.json
            judge.json
            trusted-base.txt
      - name: Fail unless VERIFIED
        if: steps.judge.outputs.exit != '0'
        run: exit 1
