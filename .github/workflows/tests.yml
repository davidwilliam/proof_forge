# Tests that need neither Docker nor the pinned Lean image: the committed Passports' hashes,
# the task and judge checks that run on the stored files, and the site, whose every figure is
# recomputed from results/. The Lean judge itself runs in proofforge.yml on pull requests.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      # Full history: the library records and the methods page resolve commits by content.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stored-file tests
        run: |
          for t in budget_controls cetus committed_passports compound feedback_library fin_kernels \
                   fin_lib harvest implement_mode isolation judge_scan model_failures \
                   muse_build_output muse_hint_diffs muse_meter muse_tool_arguments passport_cli \
                   providers realworld spec_strength task_load wins; do
            echo "::group::test_$t"
            python3 tests/test_$t.py
            echo "::endgroup::"
          done
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated data matches results/
        run: for s in evidence wins challenge methods library; do node scripts/$s.mjs --check; done
      - run: npx tsc --noEmit -p .
      - run: pnpm vitest run
